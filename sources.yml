# Feeds for the daily brief.
#
# No API keys, no quotas, no credit card. Add or remove freely — a feed that
# 404s is skipped with a warning rather than failing the build.
#
# `weight` nudges ranking: a story carried by a high-weight outlet sorts higher.
# Google News query feeds are the fallback for anything without a native feed;
# `when:1d` limits them to the last day.

window_hours: 26        # how far back an item may be published
max_stories: 28         # cap on the finished brief
max_per_sector: 5
leads: 3                # how many stories get the "Top of the day" treatment

# Only these sectors may take a lead slot — general news can still make the
# brief, it just never leads it. Remove the list to let any sector lead.
lead_sectors:
  - Markets
  - Macro
  - Banking
  - IT & AI
  - Deals & IPOs
  - Energy & Industrials

feeds:
