<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Wire</title>
<meta name="description" content="A daily business and markets brief, rebuilt every morning from public news feeds.">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
  :root {
    --paper:      #f5f4f1;
    --surface:    #ffffff;
    --sunk:       #ebe9e4;
    --ink:        #15181c;
    --ink-2:      #5a6068;
    --ink-3:      #878d95;
    --rule:       #dedbd4;
    --rule-2:     #c9c5bc;
    --accent:     #0f5c63;
    --accent-2:   #d8e6e6;
    --flag:       #9c4221;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:    #0c1015;
      --surface:  #141a21;
      --sunk:     #1a222b;
      --ink:      #e9edf1;
      --ink-2:    #98a3ae;
      --ink-3:    #6f7b86;
      --rule:     #222b35;
      --rule-2:   #35414d;
      --accent:   #5fc2c9;
      --accent-2: #1b3a3d;
      --flag:     #e08b6a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:    #0c1015;
    --surface:  #141a21;
    --sunk:     #1a222b;
    --ink:      #e9edf1;
    --ink-2:    #98a3ae;
    --ink-3:    #6f7b86;
    --rule:     #222b35;
    --rule-2:   #35414d;
    --accent:   #5fc2c9;
    --accent-2: #1b3a3d;
    --flag:     #e08b6a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric: tabular-nums;
  }

  .wrap { max-width: 780px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px; }

  /* ---------- masthead ---------- */
  .masthead { padding-block: 32px 0; }
  .masthead-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 20px;
    flex-wrap: wrap;
    border-bottom: 3px double var(--rule-2);
    padding-bottom: 10px;
  }
  .wordmark {
    font-family: Newsreader, Georgia, serif;
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 700;
    letter-spacing: -0.022em;
    line-height: 0.95;
    margin: 0;
  }
  .wordmark .thin { font-weight: 400; font-style: italic; }
  .dateline {
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding-bottom: 3px;
    white-space: nowrap;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding-block: 9px;
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .meta-row .dot { color: var(--rule-2); }
  .flag { color: var(--flag); font-weight: 500; }

  /* ---------- controls ---------- */
  .controls {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--paper);
    margin-inline: -20px;
    padding-inline: 20px;
    padding-block: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .searchbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0 10px;
    height: 36px;
  }
  .searchbar:focus-within { border-color: var(--accent); }
  .searchbar svg { flex: 0 0 auto; color: var(--ink-3); }
  .searchbar input {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    height: 100%;
  }
  .searchbar input::placeholder { color: var(--ink-3); }
  .searchbar kbd {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 5px;
  }
  .searchbar button {
    font: inherit;
    font-size: 16px;
    line-height: 1;
    color: var(--ink-3);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
  }

  .chips {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-block: 10px;
    margin-inline: -20px;
    padding-inline: 20px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.12s, color 0.12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .chip .n { opacity: 0.5; margin-left: 5px; }

  /* ---------- sections ---------- */
  .stories { list-style: none; margin: 0; padding: 0; }
  .band {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding-block: 26px 10px;
  }
  .band::after {
    content: "";
    flex: 1 1 auto;
    height: 1px;
    background: var(--rule);
  }
  .band.first { padding-top: 20px; }
  .band.lead-band { color: var(--accent); }

  /* ---------- stories ---------- */
  .story { padding-block: 20px; border-top: 1px solid var(--rule); }
  .story:first-child { border-top: none; }

  .leads {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 5px;
    margin-inline: -16px;
    padding-inline: 16px;
    padding-block: 2px 4px;
  }
  .leads .story { border-top: 1px solid var(--rule); }
  .leads .story:first-child { border-top: none; }

  .eyebrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 7px;
  }
  .eyebrow .src { color: var(--ink-2); font-weight: 500; }
  .eyebrow .sec { color: var(--accent); font-weight: 500; }
  .eyebrow .dot { color: var(--rule-2); }
  .wires {
    color: var(--ink);
    background: var(--accent-2);
    border-radius: 2px;
    padding: 2px 6px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .headline {
    font-family: Newsreader, Georgia, serif;
    font-weight: 500;
    font-size: 19.5px;
    line-height: 1.26;
    letter-spacing: -0.006em;
    text-wrap: balance;
    margin: 0 0 7px;
  }
  .leads .headline { font-size: 26px; font-weight: 600; line-height: 1.16; }
  .headline a { text-decoration: none; }
  .headline a:hover {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: var(--accent);
  }
  .headline mark {
    background: var(--accent-2);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  .dek { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }
  .leads .dek { font-size: 15.5px; }

  .why {
    font-family: Newsreader, Georgia, serif;
    font-style: italic;
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--sunk);
    border-left: 2px solid var(--accent);
    border-radius: 0 3px 3px 0;
    padding: 9px 12px;
    margin-top: 11px;
  }
  .why b {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-style: normal;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 3px;
  }
  .also {
    margin: 9px 0 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-3);
  }

  /* ---------- states ---------- */
  .notice {
    margin-top: 30px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 5px;
    color: var(--ink-2);
    font-size: 14.5px;
  }
  .notice h2 {
    font-family: Newsreader, Georgia, serif;
    font-size: 21px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .notice code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    background: var(--sunk);
    padding: 3px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-top: 4px;
  }
  .empty {
    padding: 44px 0;
    text-align: center;
    color: var(--ink-3);
    font-size: 14.5px;
  }
  .empty button {
    font: inherit;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0;
  }

  .foot {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    justify-content: space-between;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--ink-3);
  }
  .foot button {
    font: inherit;
    color: var(--ink-3);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  select.picker {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 2px 5px;
    cursor: pointer;
  }

  @media (max-width: 560px) {
    .leads .headline { font-size: 22px; }
    .headline { font-size: 18.5px; }
    .leads { margin-inline: -12px; padding-inline: 12px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .story { animation: rise 0.22s ease-out both; }
    @keyframes rise { from { opacity: 0.6; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <h1 class="wordmark">Daily<span class="thin">Wire</span></h1>
      <div class="dateline mono" id="dateline">—</div>
    </div>
    <div class="meta-row mono">
      <span id="standfirst">Loading the latest brief…</span>
      <span class="dot" id="metadot" hidden>◆</span>
      <span id="built"></span>
    </div>
  </header>

  <div class="controls">
    <div class="searchbar">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path>
      </svg>
      <input type="search" id="search" placeholder="Search headlines" aria-label="Search headlines" autocomplete="off">
      <kbd id="slashhint">/</kbd>
      <button type="button" id="clear" aria-label="Clear search" hidden>&times;</button>
    </div>
    <nav class="chips" id="chips" aria-label="Filter by sector"></nav>
  </div>

  <main>
    <ul class="stories" id="stories"></ul>
    <div class="empty" id="empty" hidden></div>
    <div class="notice" id="notice" hidden></div>
  </main>

  <footer class="foot">
    <span id="archivewrap">Archive <select class="picker" id="archive" aria-label="Choose a day"></select></span>
    <button type="button" id="theme">Switch theme</button>
  </footer>

</div>

<script>
(function () {
  "use strict";

  var stories = [];
  var sector = "All";
  var query = "";

  var elStories = document.getElementById("stories");
  var elChips = document.getElementById("chips");
  var elNotice = document.getElementById("notice");
  var elEmpty = document.getElementById("empty");
  var elArchive = document.getElementById("archive");
  var elSearch = document.getElementById("search");
  var elClear = document.getElementById("clear");

  // ---------- helpers ----------

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function timeAgo(iso) {
    if (!iso) return "";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 2) return "just now";
    if (m < 60) return m + "m ago";
    var h = Math.round(m / 60);
    if (h < 24) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  // Highlight the search term inside a headline without ever injecting HTML.
  function headlineNode(title, q) {
    var frag = document.createDocumentFragment();
    if (!q) { frag.appendChild(document.createTextNode(title)); return frag; }
    var lower = title.toLowerCase();
    var needle = q.toLowerCase();
    var from = 0;
    for (;;) {
      var at = lower.indexOf(needle, from);
      if (at === -1) break;
      if (at > from) frag.appendChild(document.createTextNode(title.slice(from, at)));
      frag.appendChild(el("mark", null, title.slice(at, at + needle.length)));
      from = at + needle.length;
    }
    frag.appendChild(document.createTextNode(title.slice(from)));
    return frag;
  }

  // ---------- rendering ----------

  function renderChips() {
    var counts = { All: stories.length };
    stories.forEach(function (s) { counts[s.sector] = (counts[s.sector] || 0) + 1; });
    var names = ["All"].concat(Object.keys(counts).filter(function (k) { return k !== "All"; }));

    elChips.innerHTML = "";
    names.forEach(function (name) {
      var chip = el("button", "chip");
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(name === sector));
      chip.appendChild(document.createTextNode(name));
      chip.appendChild(el("span", "n", counts[name]));
      chip.addEventListener("click", function () {
        sector = name;
        renderChips();
        renderStories();
      });
      elChips.appendChild(chip);
    });
  }

  function storyNode(s, hideSector) {
    var li = el("li", "story");

    var eye = el("div", "eyebrow");
    // Under a sector heading the tag just repeats the heading, so it goes.
    if (!hideSector) {
      eye.appendChild(el("span", "sec", s.sector));
      eye.appendChild(el("span", "dot", "·"));
    }
    eye.appendChild(el("span", "src", s.source));
    var ago = timeAgo(s.published);
    if (ago) {
      eye.appendChild(el("span", "dot", "·"));
      eye.appendChild(el("span", null, ago));
    }
    if (s.coverage > 1) eye.appendChild(el("span", "wires", s.coverage + " wires"));
    li.appendChild(eye);

    var h = el("h2", "headline");
    var a = el("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.appendChild(headlineNode(s.title, query));
    h.appendChild(a);
    li.appendChild(h);

    if (s.dek) li.appendChild(el("p", "dek", s.dek));
    if (s.why) {
      var why = el("p", "why");
      why.appendChild(el("b", null, "Why it matters"));
      why.appendChild(document.createTextNode(s.why));
      li.appendChild(why);
    }
    if (s.also && s.also.length) {
      li.appendChild(el("p", "also", "Also carried by " + s.also.join(", ")));
    }
    return li;
  }

  function band(text, cls) {
    return el("li", "band" + (cls ? " " + cls : ""), text);
  }

  function renderStories() {
    var q = query.toLowerCase();
    var list = stories.filter(function (s) {
      if (sector !== "All" && s.sector !== sector) return false;
      if (!q) return true;
      return (s.title + " " + s.dek + " " + s.why + " " + s.source).toLowerCase().indexOf(q) !== -1;
    });

    elStories.innerHTML = "";
    elEmpty.hidden = true;

    if (!list.length) {
      elEmpty.hidden = false;
      elEmpty.innerHTML = "";
      elEmpty.appendChild(document.createTextNode("Nothing matches that. "));
      var reset = el("button", null, "Clear filters");
      reset.type = "button";
      reset.addEventListener("click", function () {
        query = ""; sector = "All"; elSearch.value = ""; elClear.hidden = true;
        renderChips(); renderStories();
      });
      elEmpty.appendChild(reset);
      return;
    }

    // The front page groups: leads in a raised block, then the rest under
    // sector headings. Filtering or searching is a different job — a flat
    // ranked list reads better there, so the grouping drops away.
    var grouped = sector === "All" && !q;

    if (!grouped) {
      list.forEach(function (s) { elStories.appendChild(storyNode(s)); });
      return;
    }

    var leads = list.filter(function (s) { return s.lead; });
    var rest = list.filter(function (s) { return !s.lead; });

    if (leads.length) {
      elStories.appendChild(band("Top of the day", "lead-band first"));
      var block = el("li");
      var inner = el("ul", "stories leads");
      leads.forEach(function (s) { inner.appendChild(storyNode(s)); });
      block.appendChild(inner);
      elStories.appendChild(block);
    }

    var order = [];
    var bySector = {};
    rest.forEach(function (s) {
      if (!bySector[s.sector]) { bySector[s.sector] = []; order.push(s.sector); }
      bySector[s.sector].push(s);
    });
    order.forEach(function (name) {
      elStories.appendChild(band(name));
      bySector[name].forEach(function (s) { elStories.appendChild(storyNode(s, true)); });
    });
  }

  function renderBrief(brief) {
    stories = (brief.stories || []).map(function (s) {
      return {
        lead: !!s.lead, sector: s.sector || "Other", title: s.title || "",
        dek: s.dek || "", why: s.why || "", source: s.source || "",
        also: s.also || [], coverage: s.coverage || 1, url: s.url || "#",
        published: s.published || null
      };
    });

    document.getElementById("dateline").textContent = brief.dateLabel || brief.date || "";
    document.getElementById("standfirst").textContent = brief.standfirst || "";

    var built = document.getElementById("built");
    if (brief.builtAt) {
      var d = new Date(brief.builtAt);
      built.textContent = isNaN(d.getTime()) ? "" : "Built " + d.toLocaleTimeString("en-IN", {
        hour: "2-digit", minute: "2-digit"
      });
      document.getElementById("metadot").hidden = !built.textContent;
    }

    elNotice.hidden = true;
    renderChips();
    renderStories();
  }

  // ---------- loading ----------

  function getJSON(path) {
    return fetch(path, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(path + " returned " + r.status);
      return r.json();
    });
  }

  function loadDay(date) {
    return getJSON("data/" + date + ".json").then(function (brief) {
      sector = "All"; query = ""; elSearch.value = ""; elClear.hidden = true;
      renderBrief(brief);
      elArchive.value = date;
      window.scrollTo({ top: 0, behavior: "auto" });
    });
  }

  function showNotice(title, body, code) {
    elNotice.innerHTML = "";
    elNotice.appendChild(el("h2", null, title));
    elNotice.appendChild(el("p", null, body));
    if (code) {
      var p = el("p");
      p.appendChild(el("code", null, code));
      elNotice.appendChild(p);
    }
    elNotice.hidden = false;
  }

  getJSON("data/index.json")
    .then(function (index) {
      var dates = index.dates || [];
      if (!dates.length) throw new Error("no briefs yet");
      elArchive.innerHTML = "";
      dates.slice(0, 90).forEach(function (d) {
        var o = el("option", null, d);
        o.value = d;
        elArchive.appendChild(o);
      });
      document.getElementById("archivewrap").hidden = dates.length < 2;
      return loadDay(index.latest || dates[0]);
    })
    .catch(function (err) {
      document.getElementById("standfirst").textContent = "No brief loaded";
      showNotice(
        "Nothing to show yet",
        "Could not load data/index.json (" + err.message + "). If the repo is newly set up, " +
        "run the Daily brief workflow once — or build one locally:",
        "python scripts/build_brief.py"
      );
    });

  elArchive.addEventListener("change", function () {
    loadDay(elArchive.value).catch(function (err) {
      showNotice("That day could not be loaded", err.message);
    });
  });

  // ---------- search ----------

  var debounce;
  elSearch.addEventListener("input", function () {
    elClear.hidden = !elSearch.value;
    clearTimeout(debounce);
    debounce = setTimeout(function () {
      query = elSearch.value.trim();
      renderStories();
    }, 120);
  });

  elClear.addEventListener("click", function () {
    elSearch.value = ""; query = ""; elClear.hidden = true;
    renderStories();
    elSearch.focus();
  });

  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); elSearch.focus(); }
    if (e.key === "Escape" && document.activeElement === elSearch) {
      elSearch.value = ""; query = ""; elClear.hidden = true;
      renderStories(); elSearch.blur();
    }
  });

  // Touch keyboards have no "/" key worth hinting at.
  if (window.matchMedia("(hover: none)").matches) {
    document.getElementById("slashhint").hidden = true;
  }

  // ---------- theme ----------

  var root = document.documentElement;
  try {
    var saved = localStorage.getItem("wire-theme");
    if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  } catch (e) { /* private mode: follow the OS */ }

  document.getElementById("theme").addEventListener("click", function () {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var now = root.getAttribute("data-theme") || (dark ? "dark" : "light");
    var next = now === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("wire-theme", next); } catch (e) { /* ignore */ }
  });

  // ---------- offline ----------

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* optional */ });
    });
  }
})();
</script>
</body>
</html>
